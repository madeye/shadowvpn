# Docker-based end-to-end test for ShadowVPN automatic tunnel-IP assignment.
#
# Brings up one learning-mode server (no --nat) and three identical auto
# clients that omit tun_ip / peer_ip / tun_ip6. The server hands each a
# distinct IPv4 from 10.9.0.0/24 (never .1 or reserved .2) plus an embedded
# IPv6 under fd07:7::/64. Named volumes keep the server lease file and each
# client's node_id so the driver (run-e2e-assign.sh) can restart either side
# and still see the same addresses. Clients can address each other through
# the hub relay (unlike --nat).
#
#   docker/run-e2e-assign.sh            # or set CIPHER=aes-256-gcm

x-shadowvpn: &shadowvpn
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: shadowvpn-e2e:latest
  cap_add:
    - NET_ADMIN
  devices:
    - /dev/net/tun
  # The tunnel carries an assigned IPv6 ULA (fd07:7::<embedded v4>).
  sysctls:
    net.ipv6.conf.all.disable_ipv6: "0"
    net.ipv6.conf.default.disable_ipv6: "0"
  environment:
    CIPHER: ${CIPHER:-chacha20-poly1305}
    RUST_LOG: ${RUST_LOG:-info}

services:
  server:
    <<: *shadowvpn
    container_name: svpn-assign-server
    command: ["run-server-assign.sh"]
    volumes:
      - leases:/var/lib/shadowvpn

  client1:
    <<: *shadowvpn
    container_name: svpn-assign-client1
    depends_on: [server]
    command: ["run-client-assign.sh"]
    volumes:
      - client1-state:/var/lib/shadowvpn

  client2:
    <<: *shadowvpn
    container_name: svpn-assign-client2
    depends_on: [server]
    command: ["run-client-assign.sh"]
    volumes:
      - client2-state:/var/lib/shadowvpn

  client3:
    <<: *shadowvpn
    container_name: svpn-assign-client3
    depends_on: [server]
    command: ["run-client-assign.sh"]
    volumes:
      - client3-state:/var/lib/shadowvpn

volumes:
  leases:
  client1-state:
  client2-state:
  client3-state:
