[package]
name = "shadowvpn-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]   # keep this crate standalone; do not attach to any parent

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
